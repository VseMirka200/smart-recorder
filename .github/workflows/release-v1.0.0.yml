name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release tag points to main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit reachable from main."
          }

      - name: Build Smart Recorder
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\BUILD_EXE.ps1

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = '${{ github.ref_name }}'
          $ReleaseDir = Join-Path $PWD 'release-package'

          New-Item -ItemType Directory -Force -Path $ReleaseDir | Out-Null

          Copy-Item '.\SmartRecorder.exe' ".\SmartRecorder-$Version.exe"
          Copy-Item '.\SmartRecorder.exe' (Join-Path $ReleaseDir 'SmartRecorder.exe')
          Copy-Item '.\SmartRecorder.ico' (Join-Path $ReleaseDir 'SmartRecorder.ico')
          Copy-Item '.\SmartRecorder.png' (Join-Path $ReleaseDir 'SmartRecorder.png')
          Copy-Item '.\README.md' (Join-Path $ReleaseDir 'README.md')
          Copy-Item '.\LICENSE' (Join-Path $ReleaseDir 'LICENSE')

          $LaunchNotes = @(
            "Умный рекордер $Version",
            '',
            'Портативная версия:',
            '1. Запустите SmartRecorder.exe.',
            '2. Установка AutoHotkey не требуется.',
            '3. Рабочие записи создаются локально в каталоге recordings.',
            '4. Скриншоты могут содержать чувствительные данные — проверяйте их перед публикацией.',
            '',
            'Документация находится в README.md.'
          )
          $LaunchNotes | Set-Content -Path (Join-Path $ReleaseDir 'ЗАПУСК.txt') -Encoding utf8

          Compress-Archive -Path "$ReleaseDir\*" -DestinationPath ".\SmartRecorder-$Version-portable.zip" -Force

          $Files = @(
            ".\SmartRecorder-$Version.exe",
            ".\SmartRecorder-$Version-portable.zip"
          )

          $Lines = foreach ($File in $Files) {
            $Hash = (Get-FileHash -Algorithm SHA256 $File).Hash.ToLowerInvariant()
            "$Hash  $([System.IO.Path]::GetFileName($File))"
          }
          $Lines | Set-Content '.\SHA256SUMS.txt' -Encoding ascii

      - name: Publish a new GitHub Release (never overwrite existing assets)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Repo = '${{ github.repository }}'
          $Tag = '${{ github.ref_name }}'
          if ($Tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected version tag vX.Y.Z, got $Tag"
          }
          gh release view $Tag --repo $Repo *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $Tag already exists; overwriting published releases is forbidden."
          }
          gh release create $Tag `
            ".\SmartRecorder-$Tag.exe" `
            ".\SmartRecorder-$Tag-portable.zip" `
            '.\SHA256SUMS.txt' `
            --verify-tag `
            --title "Умный рекордер $Tag" `
            --generate-notes `
            --repo $Repo
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed."
          }
