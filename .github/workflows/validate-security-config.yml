name: Validate GitHub configuration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Parse GitHub configuration YAML
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate workflow and Dependabot syntax
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path(".github/workflows").glob("*.yml"))
          paths += [Path(".github/dependabot.yml")]
          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"Valid: {path}")
          PY
